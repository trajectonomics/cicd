name: Lint workflows

# actionlint catches broken expressions, unknown inputs, and bad shell in the workflow files.
# The release path only runs on main, so this is the one place a typo is found before a release.
#
# Reusable: a Consumer with bespoke workflows calls this with
#   uses: trajectonomics/cicd/.github/workflows/lint-workflows.yml@v1
# A reusable workflow's own push/pull_request triggers fire only in this repo, so a
# Consumer keeps its own thin caller (the template is in README.md).
on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
