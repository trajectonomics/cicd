name: Release

# Thin caller: the publishing logic lives in publish.yml, shared by every package.
# npm trusted publishing validates THIS file's name, so keep it called release.yml.
#
#   push to main      -> publishes an alpha (dist-tag "alpha")
#   GitHub release    -> publishes the stable version from the tag (dist-tag "latest")
#
# To release: create a GitHub release on main with a new tag vX.Y.Z. The tag is
# the version; package.json "version" is never edited by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".github/**"
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      tooling-ref: ${{ github.sha }}
      float-major-tag: true
    secrets: inherit
