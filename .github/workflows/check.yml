name: Check

# Reusable: other repos call this with
#   uses: trajectonomics/cicd/.github/workflows/check.yml@v1
# It also runs on this repo's own pushes and pull requests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      bun-version:
        description: Bun version to install.
        type: string
        default: "1.4.4"
      script:
        description: package.json script that runs every check.
        type: string
        default: check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version || '1.4.4' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        env:
          SCRIPT: ${{ inputs.script || 'check' }}
        run: bun run "$SCRIPT"
