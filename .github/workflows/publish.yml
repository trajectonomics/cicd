name: Publish

# Shared npm publishing for every Trajectonomics package. Call it from a thin
# release.yml in the package repo:
#
#   name: Release
#   on:
#     push:
#       branches: [main]
#       paths-ignore: ["**/*.md", ".agents/**", ".claude/**", ".github/**"]
#     workflow_dispatch:
#       inputs:
#         bump:
#           type: choice
#           options: [auto, patch, minor, major]
#           default: auto
#   permissions:
#     contents: write
#     id-token: write
#   jobs:
#     publish:
#       uses: trajectonomics/cicd/.github/workflows/publish.yml@v1
#       with:
#         bump: ${{ inputs.bump || 'auto' }}
#
# push to main      -> alpha  (dist-tag "alpha"), version from scripts/version.ts
# manual dispatch   -> stable (dist-tag "latest"): computes the version, publishes to npm,
#                      then creates the tag vX.Y.Z and the GitHub release
#
# npm trusted publishing validates the CALLING workflow: configure the package's
# Trusted Publisher with the caller's repository and filename (release.yml), and
# allow "publish directly". Caller and this workflow both need id-token: write.
on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version to install.
        type: string
        default: "1.4.4"
      tooling-ref:
        description: Ref of trajectonomics/cicd that supplies scripts/. Use the ref you pin this workflow to.
        type: string
        default: v1
      bump:
        description: "Stable version bump: auto reads commit messages since the last release."
        type: string
        default: auto
      float-major-tag:
        description: After a stable release, move the floating major tag (v1) to it.
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        description: Optional. Needed only when no trusted publisher is configured yet.
        required: false

permissions:
  contents: write # floating major tag
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and commit messages drive alpha versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Stable releases must run on main
        if: env.EVENT == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the stable release from main, not $GITHUB_REF."
          exit 1

      - run: bun install --frozen-lockfile
      - run: bun run check

      # scripts/ lives in trajectonomics/cicd; copy it out so it is never part of the package.
      - uses: actions/checkout@v4
        with:
          repository: trajectonomics/cicd
          ref: ${{ inputs.tooling-ref }}
          path: .cicd
          sparse-checkout: scripts
      - name: Stash shared scripts
        run: |
          cp -r .cicd/scripts "$RUNNER_TEMP/cicd-scripts"
          rm -r .cicd

      - name: Plan and compute version
        id: plan
        run: |
          PLAN=$(bun "$RUNNER_TEMP/cicd-scripts/release-plan.ts" --event "$EVENT")
          CHANNEL=$(echo "$PLAN" | jq -r .channel)
          VERSION=$(bun "$RUNNER_TEMP/cicd-scripts/version.ts" --channel "$CHANNEL" --bump "${BUMP:-auto}")
          echo "Publishing $VERSION ($CHANNEL)"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$(echo "$PLAN" | jq -r .distTag)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # Uses NPM_TOKEN when the secret is set; otherwise npm uses trusted publishing (OIDC).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          fi
          npm publish --tag "$DIST_TAG" --provenance

      # Tag and release only after npm accepted the version, so a failed publish leaves no tag.
      - name: Tag and GitHub release
        if: steps.plan.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes

      # Consumers pin reusable workflows to a floating major tag, e.g. @v1.
      - name: Move floating major tag
        if: steps.plan.outputs.channel == 'stable' && inputs.float-major-tag
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          MAJOR="v${VERSION%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
